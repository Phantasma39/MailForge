<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>POP3 协议演示终端</title>
<style>
  body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;max-width:880px;margin:20px auto;padding:0 12px;}
  h2{margin:10px 0;}
  .card{border:1px solid #d8dee6;border-radius:10px;padding:14px;margin-bottom:14px;background:#fff;}
  .btns button{margin:0 6px 6px 0;}
  button{font:inherit;padding:7px 14px;border:1px solid #cfd6df;border-radius:8px;background:#fff;cursor:pointer;}
  button:hover{background:#f3f6fa;}
  button.primary{background:#2563eb;color:#fff;border-color:#2563eb;}
  button:disabled{opacity:.55;cursor:not-allowed;}
  input{font-size:14px;padding:8px 10px;width:calc(100% - 20px);margin-top:6px;}
  #st{color:#2563eb;font-size:13px;margin-left:10px;}
  #log{background:#10151c;color:#dfe6ee;padding:12px;border-radius:8px;height:400px;overflow:auto;
       font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.7;
       white-space:pre-wrap;word-break:break-all;}
  .c{color:#7ee08a;} .s{color:#ffd479;} .w{color:#5fb1ff;} .t{color:#7a8794;}
  .tip{color:#5f6b76;font-size:13px;line-height:1.9;}
  code{background:#eef2f7;padding:1px 6px;border-radius:4px;font-size:12px;}
</style>
</head>
<body>
<h2>📥 POP3 协议演示终端（端口 1110）</h2>
<div class="card">
  <div class="btns">
    <button onclick="conn()">1️⃣ 连接</button>
    <button class="primary" id="btnAuto" onclick="autoDemo()">▶ 自动演示（每条间隔 1 秒）</button>
    <button onclick="disconn()">断开</button>
    <a href="/"><button>← 返回首页</button></a>
    <span id="st"></span>
  </div>
  <p class="tip">自动演示会登录<code>当前首页账号</code>并依次执行
    <code>USER</code> → <code>PASS</code> → <code>STAT</code> → <code>LIST</code> →
    <code>RETR 1</code>（若邮箱有信）→ <code>QUIT</code>。请在下方填入该账号的密码（浏览器不会保存）。</p>
  <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
    <span class="tip">自动演示账号：<b id="autoUser">bob</b>　密码</span>
    <input id="autoPass" type="password" placeholder="例如 123456" style="width:180px;margin:0"
           autocomplete="off">
  </div>
</div>
<div class="card">
  <label class="tip"><b>手动发送一行：</b></label>
  <input id="line" placeholder="如 USER bob / PASS 123456 / STAT / LIST / RETR 1 / QUIT…（Enter 发送）" autocomplete="off">
</div>
<div class="card"><div id="log"><span class="t">（点“连接”，然后 USER / PASS 登录；或直接点“▶ 自动演示”）</span></div></div>
<script>
const TOKEN = localStorage.getItem("mf_token") || "";
const USER = localStorage.getItem("mf_user") || "bob";
let CONN = "";
let BUSY = false;
const log = document.getElementById("log");
document.getElementById("autoUser").textContent = USER + "@example.com";
if (!TOKEN) log.innerHTML = "<span class='s'>请先在首页登录后再来。</span>";

const sleep = ms => new Promise(r => setTimeout(r, ms));
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function out(who, txt){
  const cls = who==="C" ? "c" : (who==="W" ? "w" : "s");
  const tag = who==="C" ? "你→ " : (who==="W" ? "* " : "服务器← ");
  log.innerHTML += "<span class='"+cls+"'>"+esc(tag)+esc(txt)+"</span>\n";
  log.scrollTop = log.scrollHeight;
}
async function api(path, obj){
  const body = new URLSearchParams(obj);
  const r = await fetch(path,{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:body.toString()});
  return r.json();
}
function setSt(t){ document.getElementById("st").textContent = t; }

async function conn(){
  if (!TOKEN) return alert("请先在首页登录");
  if (CONN) return;
  setSt("连接中…");
  const j = await api("/api/raw/pop3/open", { token: TOKEN });
  if (!j.ok){ out("W", j.msg); setSt("连接失败"); return; }
  CONN = j.conn;
  setSt("已连接 conn=" + CONN.slice(0,20) + "…");
  for (const l of j.lines) out(l.who, l.text);
}

async function disconn(){
  if (CONN) await api("/api/raw/pop3/close", { token: TOKEN, conn: CONN });
  CONN = ""; setSt("已断开");
}

// 发送一行；返回 {ok, lines}（lines 为服务器应答文本）
async function sendOne(line, quiet){
  out("C", line === "" ? "(空行)" : line);
  const j = await api("/api/raw/pop3/send", { token: TOKEN, conn: CONN, line: line });
  if (!j.ok){ out("W", j.msg); setSt("会话异常，已断开"); CONN=""; return {ok:false, lines:[]}; }
  if (j.waiting && !quiet) out("W", "（服务器暂不应答）");
  const texts = [];
  for (const l of j.lines){ out(l.who, l.text); texts.push(l.text); }
  if (j.closed){ out("W", "服务器已关闭连接"); CONN=""; setSt("已断开"); }
  return {ok: !j.closed, lines: texts};
}

async function manualSend(){
  const box = document.getElementById("line");
  const line = box.value;
  box.value = "";
  if (!CONN) return alert("请先点“连接”");
  await sendOne(line, false);
}

/* ---------- 自动演示：每条命令间隔 1 秒 ---------- */
async function autoDemo(){
  if (BUSY || !TOKEN) return;
  const pass = document.getElementById("autoPass").value;
  if (!pass){ alert("请先填写当前账号的密码（用于 PASS 登录）"); return; }
  BUSY = true;
  document.getElementById("btnAuto").disabled = true;
  log.innerHTML = "";
  try{
    if (!CONN){
      await conn();
      if (!CONN) return;
    }
    await sleep(1000);
    let hasMail = false;
    const steps = ["USER " + USER, "PASS " + pass, "STAT"];
    for (const s of steps){
      const r = await sendOne(s, true);
      if (!r.ok) return;
      if (s === "STAT"){
        const m = r.lines.join("\n").match(/\+OK\s+(\d+)/);
        hasMail = m && parseInt(m[1], 10) > 0;
      }
      await sleep(1000);
    }
    const list = await sendOne("LIST", true);
    if (!list.ok) return;
    await sleep(1000);

    if (hasMail){
      const retr = await sendOne("RETR 1", true);   // 收取第 1 封，展示完整原文
      if (!retr.ok) return;
      out("W", "（上面这一整段就是第 1 封邮件的原始内容）");
      await sleep(1000);
    } else {
      out("W", "（邮箱暂无邮件，跳过 RETR 1）");
      await sleep(1000);
    }

    await sendOne("QUIT", true);
    out("W", "自动演示结束。QUIT 已使 POP3 会话关闭（不影响邮箱中的邮件）。");
  }finally{
    BUSY = false;
    document.getElementById("btnAuto").disabled = false;
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.activeElement.id === "line") manualSend();
});
</script>
</body>
</html>
